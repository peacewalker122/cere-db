name: Rust

on:
  push:
    branches: [ "main" ]
    paths:
      - "**.rs"
      - "**.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "**.rs"
      - "**.yml"

env:
  CARGO_TERM_COLOR: always

jobs:
  test:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    - name: Run tests
      run: cargo test --verbose -- --test-threads=1
