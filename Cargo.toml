[package]
name = "ceredb"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.0"
log = "0.4.29"
env_logger = "0.11"
thiserror = "2.0.17"
fastbloom = "0.17"
clap = { version = "4.5", features = ["derive"] }
crossbeam-skiplist = "0.1"
chrono = "0.4.43"
async-trait = "0.1"
tokio = { version = "1.43", features = [
  "rt-multi-thread", # Enables the M:N work-stealing scheduler
  "macros",          # Enables #[tokio::main]
  "io-util",         # Essential for AsyncRead/AsyncWrite helpers
  "fs",              # Asynchronous file operations for SSTables/WAL
  "sync",            # MPSC channels for MemTable -> Flush communication
  "time",            # Needed for timeouts (e.g., during network calls)
] }
tokio-util = "0.7.18"
openraft = { version = "0.9.24", features = ["serde", "serde_json", "storage-v2"] }
serde_json = "1"
reqwest = { version = "0.13.4", features = ["json"] }
axum = "0.8.9"
tokio-stream = "0.1.18"
bincode = "1"

[dev-dependencies]
uuid = { version = "1.11", features = ["v4"] }
tempfile = "3.15"
dhat = "0.3.3"

[[test]]
name = "integration"
path = "tests/integration/mod.rs"

[profile.release]
debug = 1

[features]
dhat-heap = [] # Feature to toggle profiling
