[package]
name = "ceredb"
version = "0.1.0"
edition = "2024"

[dependencies]
crc32fast = "1.5.0"
log = "0.4.29"
env_logger = "0.11"
thiserror = "2.0.17"
fastbloom = "0.17"
clap = { version = "4.5", features = ["derive"] }
crossbeam-skiplist = "0.1"
chrono = "0.4.43"
crossbeam-channel = "0.5.15"
async-trait = "0.1"
tokio = { version = "1.43", features = [
  "rt-multi-thread", # Enables the M:N work-stealing scheduler
  "macros",          # Enables #[tokio::main]
  "io-util",         # Essential for AsyncRead/AsyncWrite helpers
  "fs",              # Asynchronous file operations for SSTables/WAL
  "sync",            # MPSC channels for MemTable -> Flush communication
  "time",            # Needed for timeouts (e.g., during network calls)
] }
rayon = "1.11.0"
rust-raft = { git = "https://github.com/peacewalker122/rust-raft", version = "0.1.0" }

[dev-dependencies]
uuid = { version = "1.11", features = ["v4"] }
tempfile = "3.15"
dhat = "0.3.3"

[profile.release]
debug = 1

[features]
dhat-heap = [] # Feature to toggle profiling
