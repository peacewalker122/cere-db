[package]
name = "ceredb-rocksdb-compare"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "=1.0.102"
ceredb = { path = "../.." }
rocksdb = { version = "=0.24.0", default-features = false }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
tempfile = "=3.27.0"
tokio = { version = "=1.50.0", features = ["rt-multi-thread", "macros"] }
